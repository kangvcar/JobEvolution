name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/jobevolution
        ports:
          - 17687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e "apps/api[dev]"
      - name: mock three-item eval
        env:
          ALIGN_THRESHOLD: "0.11"
        run: python -m app.eval report --mock --coverage 0
      - name: coverage gate
        env:
          TEST_NEO4J_URI: bolt://localhost:17687
        run: pytest --cov -q
