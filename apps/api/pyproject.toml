[project]
name = "jobevolution-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "neo4j",
  "openai",
  "pdfplumber",
  "python-docx",
  "python-multipart",
  "redis",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
