services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-jobevolution}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_official_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  neo4j-test:
    image: neo4j:5-community
    profiles: ["test"]
    ports:
      - "17687:7687"
      - "17474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-jobevolution}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      BAI_API_KEY: ${BAI_API_KEY:-}
      BAI_BASE_URL: ${BAI_BASE_URL:-https://api.b.ai/v1}
      BAI_MODEL: ${BAI_MODEL:-deepseek-v4-flash-vision-exp}
      BAI_DISABLE_THINKING: ${BAI_DISABLE_THINKING:-1}
      TUZI_API_KEY: ${TUZI_API_KEY:-}
      TUZI_BASE_URL: ${TUZI_BASE_URL:-https://api.tu-zi.com/v1}
      TUZI_MODEL: ${TUZI_MODEL:-gpt-5.6-luna}
      TUZI_REASONING_EFFORT: ${TUZI_REASONING_EFFORT:-none}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-jobevolution}
      REDIS_URL: redis://redis:6379/0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      DATA_DIR: /app/data/official-only
      JD_DIR: /app/data/official-only/jd
      EVAL_DIR: /app/data/eval-official-only
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/meta')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  pipeline:
    build: ./apps/api
    command: sh -c 'while true; do python -m app.collectors --daily || true; sleep 86400; done'
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      BAI_API_KEY: ${BAI_API_KEY:-}
      BAI_BASE_URL: ${BAI_BASE_URL:-https://api.b.ai/v1}
      BAI_MODEL: ${BAI_MODEL:-deepseek-v4-flash-vision-exp}
      BAI_DISABLE_THINKING: ${BAI_DISABLE_THINKING:-1}
      TUZI_API_KEY: ${TUZI_API_KEY:-}
      TUZI_BASE_URL: ${TUZI_BASE_URL:-https://api.tu-zi.com/v1}
      TUZI_MODEL: ${TUZI_MODEL:-gpt-5.6-luna}
      TUZI_REASONING_EFFORT: ${TUZI_REASONING_EFFORT:-none}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-jobevolution}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data/official-only
      JD_DIR: /app/data/official-only/jd
      COLLECT_KNOWN_PAGES: ${COLLECT_KNOWN_PAGES:-2}
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  neo4j_data:
  neo4j_test_data:
  neo4j_official_data:
  redis_data:
